<link rel="stylesheet" href="../estilo_loja.css">
<script src="script_admin.js" defer></script>
<script src="script_admin_loja.js" defer></script>
</head>
<body>

<noscript>
    <div class="aviso-noscript">
        ⚠️ Este painel precisa de JavaScript habilitado para funcionar. Habilite o JavaScript no seu navegador.
    </div>
</noscript>

<header class="admin-header">
    <a href="painel.html" class="logo-admin">386 <span>Admin</span></a>
    <button type="button" class="menu-toggle-admin" aria-label="Abrir menu" aria-expanded="false">☰</button>
    <nav><ul>
            <li><a href="painel.html">Painel</a></li>
            <li><a href="aluno.html">Alunos</a></li>
            <li><a href="atividades.html">Atividades</a></li>
            <li><a href="loja.html" class="ativo">Loja</a></li>
            <li><a href="pedidos.html">Pedidos</a></li>
            <li><a href="conteudo.html">Conteúdo</a></li>
            <li><a href="log.html">Log</a></li>
    </ul></nav>
    <button class="sair-btn" onclick="window.location.href='logout.php'">Sair</button>
</header>

<main class="admin-main">
    <h1 class="admin-titulo">Loja</h1>
    <p class="admin-subtitulo">Itens que aparecem para os alunos resgatarem.</p>

    <div class="admin-cartao">
        <h2 id="titulo-formulario-item">Novo item</h2>
        <form id="form-item" class="admin-form">
            <div class="admin-form-linha">
                <div>
                    <label for="item-id">Identificador (só letras minúsculas/números/hífen)</label>
                    <input type="text" id="item-id" placeholder="ex: caderno-eco" required>
                </div>
                <div>
                    <label for="item-nome">Nome</label>
                    <input type="text" id="item-nome" required maxlength="80">
                </div>
                <div>
                    <label for="item-valor">Preço</label>
                    <input type="number" id="item-valor" step="0.01" min="0.01" required>
                </div>
            </div>
            <div class="admin-form-linha">
                <div>
                    <label for="item-icone">Ícone (emoji, se não usar imagem)</label>
                    <input type="text" id="item-icone" maxlength="8" placeholder="🎁">
                </div>
            </div>

            <label>Imagem (opcional, tem prioridade sobre o ícone)</label>
            <div class="admin-campo-imagem">
                <div class="admin-campo-imagem__upload">
                    <input type="file" id="item-imagem-arquivo" accept="image/jpeg,image/png,image/gif,image/webp">
                    <div class="admin-campo-imagem__url-linha">
                        <input type="text" id="item-imagem-url" placeholder="ou cole uma URL pra baixar">
                        <button type="button" class="admin-btn secundario admin-nowrap" id="item-btn-baixar-url">Baixar</button>
                    </div>
                    <input type="hidden" id="item-imagem" value="">
                </div>
                <div class="admin-campo-imagem__preview-coluna">
                    <div id="item-preview-imagem" class="admin-preview-caixa"></div>
                    <button type="button" class="admin-btn perigo pequeno admin-nowrap oculto" id="item-btn-remover-imagem">Remover imagem</button>
                </div>
            </div>

            <div class="admin-form-acoes">
                <button type="submit" class="admin-btn">Salvar item</button>
                <button type="button" class="admin-btn secundario" id="btn-visualizar-item">👁️ Visualizar card</button>
                <button type="button" class="admin-btn secundario oculto" id="btn-cancelar-edicao-item">Cancelar edição</button>
            </div>

            <div id="preview-card-item" class="admin-preview-item oculto">
                <p class="admin-subtitulo">Como vai aparecer na loja:</p>
                <div id="preview-card-item-conteudo" class="admin-preview-item__conteudo"></div>
            </div>
        </form>
    </div>

    <div class="admin-cartao">
        <h2>Catálogo</h2>
        <div class="rolagem-horizontal">
            <table class="admin-tabela">
                <thead><tr><th></th><th>Nome</th><th>Preço</th><th>Status</th><th></th></tr></thead>
                <tbody id="corpo-itens">
                    <tr><td colspan="5" class="admin-vazio">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
