<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - EcoCoins</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="script_login_perfil.js" defer></script>
</head>
<body id="pagina_login">

    <noscript>
        <div class="aviso-noscript">
            ⚠️ Este site precisa de JavaScript habilitado para funcionar. Habilite o JavaScript no seu navegador.
        </div>
    </noscript>

    <a href="/" class="logo-text">386 <span>EcoCoin</span></a>
    
    <div class="acesso">
        <h1 id="titulo">Acesse sua conta</h1>
        
        <section class="area-cadastro">
            
            <form id="login" class="cadastrar">
                <ul>
                    <li><input type="email" id="email_login" placeholder="E-mail" autocomplete="email" required></li>
                    <li><input type="password" id="senha_login" placeholder="Senha" autocomplete="current-password" required></li>
                    <li><input type="submit" id="btn_entrar" class="btn-entrar" value="Entrar"></li>
            
                    <li class="texto-centro">
                    <a href="recuperar.html" class="link-claro link-claro--grande">
                    Esqueci minha senha
                    </a></li>
                </ul>
            </form>
            
            <form id="nova_conta" class="cadastrar oculto">
                <ul>
                    <li><input type="text" id="nome_cadastro" placeholder="Nome Completo" autocomplete="name" required></li>
                    <li><input type="text" id="turma_cadastro" placeholder="Turma" required></li>
                    <li><input type="text" id="matricula_cadastro" inputmode="numeric" autocomplete="off" placeholder="Matrícula" required></li>
                    <li><input type="email" id="email_cadastro" placeholder="E-mail" autocomplete="email" required></li>
                    <li><input type="password" id="senha_cadastro" placeholder="Senha" autocomplete="new-password" required></li>
                    <li><input type="password" id="confsenha" placeholder="Confirmar Senha" autocomplete="new-password" required></li>
                    <li><input type="submit" id="btn_cadastrar" class="btn-entrar" value="Cadastrar"></li>
                </ul>
            </form>
            <div class="redes">
                <ul>
                    <li><a id="btn_inicio" class="btn-entrar btn-entrar--bloco" href="/">Voltar à página inicial</a></li>
                    <li><button id="btn_conta" class="btn-entrar btn-entrar--escuro">Não tenho conta</button></li>
                </ul>
            </div>

            <div class="bloco-ajuda-whatsapp">
                <a href="https://wa.me/SEUNUMERO?text=Olá,%20preciso%20de%20ajuda%20para%20recuperar%20minha%20senha%20do%20EcoCoin"
                    id="link-whatsapp-login"
                    target="_blank"
                    class="link-claro">
                    Problema no login? Fale com um monitor
                </a>
            </div>
            
        </section>
    </div>

</body>
</html>
