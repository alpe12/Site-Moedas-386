<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Geral - EcoCoin CIEP 386</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="script_ranking.js" defer></script>
</head>
<body>
    <noscript>
        <div class="aviso-noscript">
            ⚠️ Este site precisa de JavaScript habilitado para funcionar completamente. Habilite o JavaScript no seu navegador.
        </div>
    </noscript>
    <header>
        <div class="nav-container">
            <a href="/" class="logo-text">386 <span>EcoCoin</span></a>
            <button type="button" class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
            <nav><ul>
                <li><a href="/">INÍCIO</a></li>
                <li><a href="loja.html">LOJA</a></li>
                <li><a href="ranking.html" class="link-ativo">RANKING</a></li>
                <li><a href="perfil.html">PERFIL</a></li>
            </ul></nav>
        </div>
    </header>

    <main class="main-content-single">

        <div class="card">
            <div class="cabecalho-ranking">
                <div>
                    <span class="tag-azul">Classificação</span>
                    <h2>Ranking Geral de Alunos</h2>
                    <p class="desc">Acompanhe o desempenho de todos os alunos do CIEP 386.</p>
                </div>
                
                <div class="controles-ranking">
                    <span id="grupoBusca" class="grupo-busca">
                        <input type="text" id="buscaNome" placeholder="🔍 Buscar aluno...">
                    </span>
                    <label>
                        Mostrar:
                        <select id="limiteRanking">
                            <option value="10">10</option>
                            <option value="20" selected>20</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </label>
                </div>
            </div>
        </div>        
   
        <div class="card card--tabela">
                    <table id="tabelaRankingGeral">
                        <thead>
                            <tr>
                                <th>Posição</th>
                                <th>Nome do Aluno</th>
                                <th>Turma</th>
                                <th>EcoCoins 🪙</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabelaRanking">
                            <tr>
                                <td colspan="4" class="texto-estado texto-estado--tabela">
                                Carregando ranking...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
        <div class="card">
            <span class="ranking-title">Resumo por Turma</span>
            <div id="gradeTurmas" class="turmas-ranking-grid">
                <p class="texto-estado">Carregando turmas...</p>
            </div>
        </div>
    </main>
    <footer></footer>
</body>
</html>
