<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Geral - EcoCoin CIEP 386</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <noscript>
        <div style="background:#fef2f2; color:#7f1d1d; text-align:center; padding:14px 20px; font-weight:700; border-bottom:2px solid #dc2626;">
            ⚠️ Este site precisa de JavaScript habilitado para funcionar completamente. Habilite o JavaScript no seu navegador.
        </div>
    </noscript>
    <header>
        <div class="nav-container">
            <a href="/" class="logo-text" style="text-decoration:none;">386 <span>EcoCoin</span></a>
            <button type="button" class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">☰</button>
            <nav><ul>
                <li><a href="/">INÍCIO</a></li>
                <li><a href="loja.html">LOJA</a></li>
                <li><a href="ranking.html" class="link-ativo">RANKING</a></li>
                <li><a href="perfil.html">PERFIL</a></li>
            </ul></nav>
        </div>
    </header>

    <main class="main-content-single">

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <div>
                    <span class="tag-azul">Classificação</span>
                    <h2 style="margin-top: 10px;">Ranking Geral de Alunos</h2>
                    <p class="desc">Acompanhe o desempenho de todos os alunos do CIEP 386.</p>
                </div>
                
                <div class="login-mini" style="flex-direction: row; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <span id="grupoBusca" style="display:flex; align-items:center; flex: 1 1 160px; min-width: 160px;">
                        <input type="text" id="buscaNome" placeholder="🔍 Buscar aluno..." style="width: 100%; max-width: 220px;">
                    </span>
                    <label style="font-size: 0.85rem; color: var(--text-gray); display:flex; align-items:center; gap:6px;">
                        Mostrar:
                        <select id="limiteRanking" style="padding: 6px 10px; border-radius: var(--raio-medio, 8px); border: 1px solid var(--cor-borda);">
                            <option value="10">10</option>
                            <option value="20" selected>20</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </label>
                </div>
            </div>
        </div>        
   
        <div class="card" style="padding: 0; overflow-x: auto;">
                    <table id="tabelaRankingGeral">
                        <thead>
                            <tr>
                                <th>Posição</th>
                                <th>Nome do Aluno</th>
                                <th>Turma</th>
                                <th>EcoCoins 🪙</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabelaRanking">
                            <tr>
                                <td colspan="4" style="text-align: center; padding: 40px; color: #999;">
                                Carregando ranking...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
        <div class="card">
            <span class="ranking-title">Resumo por Turma</span>
            <div id="gradeTurmas" class="turmas-ranking-grid" style="margin: 10px auto 10px auto;">
                <p style="color: var(--text-gray); text-align:center; width:100%;">Carregando turmas...</p>
            </div>
        </div>
    </main>
    <footer></footer>
    <script src="script.js"></script>
    <script src="script_ranking.js"></script>
</body>
</html>
